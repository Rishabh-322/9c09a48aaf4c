services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    environment:
      WINDSCOPE_DATA_MODE: ${WINDSCOPE_DATA_MODE:-live}
      WINDSCOPE_CACHE_DIR: /data/cache
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/service/app:ro
      - elexon_cache:/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - backend
volumes:
  elexon_cache:
  frontend_modules:
